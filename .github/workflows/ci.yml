name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # format, lint, types, tests, build, and the package as an app installs it
    uses: mirafive/.github/.github/workflows/js-sdk.yml@d99bb0580ad7349345520d9dd4f9d49d62c3d060
