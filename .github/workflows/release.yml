# Merging a new version (package.json and its CHANGELOG.md section) to main releases it.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: mirafive/.github/.github/workflows/js-sdk-release.yml@d99bb0580ad7349345520d9dd4f9d49d62c3d060
    permissions:
      contents: write
      id-token: write
    secrets: inherit
